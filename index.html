
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>두산 베어스 선수 소트</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #203451;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Malgun Gothic", sans-serif;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

main {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: 32px 4% 24px;
}

#game {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .92fr) minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 12px;
  row-gap: 30px;
}

.info {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: #203451;
  font-size: 29px;
  font-weight: 400;
  text-align: center;
}

#number {
  font-weight: 400;
}

.progress {
  grid-column: 1 / -1;
  height: 3px;
  margin-top: -20px;
  background: #edf0f3;
  overflow: hidden;
}

#bar {
  width: 0;
  height: 100%;
  background: #203451;
  transition: width .15s;
}

.players {
  display: contents;
}

.player {
  width: 100%;
  min-width: 0;
  height: clamp(170px, 36vh, 290px);
  padding: 8px;
  background: #fff;
  border: 2px solid #222;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-wrap: anywhere;
  font-size: clamp(15px, 4.5vw, 21px);
  font-weight: 400;
}

.player:active,
.choice:active {
  background: #f1f3f6;
}

#left {
  grid-column: 1;
  grid-row: 2;
}

#right {
  grid-column: 3;
  grid-row: 2;
}

.actions {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.choice {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 6px 2px;
  border: 2px solid #222;
  border-radius: 0;
  background: #fff;
  font-size: clamp(12px, 3.7vw, 18px);
  font-weight: 400;
}

.tagline {
  margin: 135px 0 0;
  text-align: center;
  color: #203451;
  font-size: clamp(15px, 4.4vw, 21px);
  line-height: 1.7;
}

.hidden {
  display: none !important;
}

#result {
  margin-top: 32px;
}

#result h2 {
  text-align: center;
  font-size: 22px;
  font-weight: 500;
}

#summary {
  text-align: center;
  color: #687789;
  font-size: 14px;
  line-height: 1.7;
}

#ranking {
  padding-left: 30px;
}

#ranking li {
  padding: 13px 4px;
  border-bottom: 1px solid #e8ebef;
  font-size: 16px;
}

.primary,
.secondary {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #bfc8d2;
  border-radius: 0;
  background: #fff;
  color: #203451;
}

.secondary {
  margin-bottom: 12px;
}

details {
  margin-top: 32px;
  border-top: 1px solid #eee;
  padding-top: 14px;
  color: #203451;
}

summary {
  padding: 8px 0;
  cursor: pointer;
  font-size: 14px;
}

.help {
  color: #748094;
  font-size: 12px;
  line-height: 1.7;
}

textarea {
  display: block;
  width: 100%;
  min-height: 180px;
  padding: 10px;
  border: 1px solid #ccd3dc;
  border-radius: 0;
  font: 14px/1.7 monospace;
}

@media (max-width: 380px) {
  main {
    padding-top: 28px;
  }

  #game {
    column-gap: 8px;
    row-gap: 26px;
  }

  .info {
    font-size: 25px;
  }

  .player {
    height: clamp(165px, 34vh, 260px);
  }

  .choice {
    font-size: 12px;
  }

  .tagline {
    margin-top: 110px;
  }
}
</style>
</head>

<body>
<main>
  <section id="game">
    <div class="info">
      <span>Battle No.<b id="number">1</b></span>
      <span id="percent">0% sorted.</span>
    </div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <div class="players">
      <button class="player" id="left" aria-label="왼쪽 선수 선택">
        선수 A
      </button>
      <button class="player" id="right" aria-label="오른쪽 선수 선택">
        선수 B
      </button>
    </div>

    <div class="actions">
      <button class="choice" id="both">둘 다 좋다</button>
      <button class="choice" id="unknown">모르겠다</button>
    </div>
  </section>

  <p class="tagline" id="tagline">
    내년에는 가을야구 꼬오옥...
  </p>

  <section id="result" class="hidden">
    <h2>최종 순위</h2>
    <p id="summary"></p>
    <ol id="ranking"></ol>
    <button class="primary" id="copy">순위 복사</button>
    <button class="secondary" id="restart">처음부터 다시</button>
  </section>

  <details>
    <summary>선수 목록 수정하기</summary>
    <p class="help">
      한 줄에 선수 한 명씩 입력해 줘. 중복 이름은 자동으로 하나만 남겨.
      목록을 적용하면 새로운 소트가 시작돼.
    </p>
    <textarea id="names"></textarea>
    <button class="primary" id="apply">목록 적용하기</button>
  </details>
</main>

<script>
const initial = [
  "곽빈", "김택연", "최원준", "최승용", "이영하",
  "박치국", "김명신", "이병헌", "최준호", "김유성",
  "양의지", "김기연", "강승호", "양석환", "박준순",
  "이유찬", "박지훈", "오명진", "정수빈", "조수행",
  "김민석", "김대한", "김인태", "전다민", "홍성호",
  "박계범", "안재석", "여동건", "김민규", "박신지",
  "김동준", "김준상", "임종성", "류현준", "김성재",
  "최민석", "김호준", "양재훈", "윤태호", "이선우",
  "이상혁", "천현재", "케이브",
  "후보 선수 1", "후보 선수 2", "후보 선수 3",
  "후보 선수 4", "후보 선수 5", "후보 선수 6",
  "후보 선수 7"
];

const $ = id => document.getElementById(id);

let names = [...initial];
let scores = {};
let pairs = [];
let index = 0;
let skipped = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function start() {
  scores = {};
  names.forEach(name => scores[name] = 0);
  skipped = 0;
  index = 0;

  const allPairs = [];

  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      allPairs.push([names[i], names[j]]);
    }
  }

  pairs = shuffle(allPairs).slice(0, Math.min(250, allPairs.length));

  $("game").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("tagline").classList.remove("hidden");

  show();
  window.scrollTo(0, 0);
}

function show() {
  if (index >= pairs.length) {
    finish();
    return;
  }

  const [a, b] = pairs[index];

  $("left").textContent = a;
  $("right").textContent = b;

  $("number").textContent = index + 1;

  const percent = Math.round(index / pairs.length * 100);
  $("percent").textContent = percent + "% sorted.";
  $("bar").style.width = percent + "%";
}

function vote(choice) {
  if (index >= pairs.length) return;

  const [a, b] = pairs[index];

  if (choice === "a") scores[a]++;
  if (choice === "b") scores[b]++;

  if (choice === "both") {
    scores[a] += 0.5;
    scores[b] += 0.5;
  }

  if (choice === "unknown") skipped++;

  index++;
  show();
}

function finish() {
  $("game").classList.add("hidden");
  $("tagline").classList.add("hidden");
  $("result").classList.remove("hidden");

  $("percent").textContent = "100% sorted.";
  $("bar").style.width = "100%";

  $("summary").textContent =
    names.length + "명 · " + pairs.length +
    "회 대결 · 건너뛰기 " + skipped +
    "회. 선택 점수 기준 순위야.";

  const sorted = [...names].sort((a, b) => scores[b] - scores[a]);

  $("ranking").replaceChildren();

  sorted.forEach((name, i) => {
    const li = document.createElement("li");
    li.textContent = (i + 1) + "위　" + name +
      "　(" + scores[name] + "점)";
    $("ranking").appendChild(li);
  });

  window.scrollTo(0, 0);
}

$("left").addEventListener("click", () => vote("a"));
$("right").addEventListener("click", () => vote("b"));
$("both").addEventListener("click", () => vote("both"));
$("unknown").addEventListener("click", () => vote("unknown"));

$("restart").addEventListener("click", () => {
  if (confirm("선택 결과를 지우고 다시 시작할까?")) start();
});

$("copy").addEventListener("click", async () => {
  const text = [...$("ranking").children]
    .map(item => item.textContent)
    .join("\n");

  try {
    await navigator.clipboard.writeText(text);
    alert("순위를 복사했어!");
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    const success = document.execCommand("copy");
    area.remove();
    alert(success ? "순위를 복사했어!" : "순위를 길게 눌러 복사해 줘.");
  }
});

$("names").value = initial.join("\n");

$("apply").addEventListener("click", () => {
  const next = [...new Set(
    $("names").value
      .split(/\r?\n/)
      .map(name => name.trim())
      .filter(Boolean)
  )];

  if (next.length < 2) {
    alert("선수를 2명 이상 입력해 줘.");
    return;
  }

  names = next;
  start();
});

start();
</script>
</body>
</html>
